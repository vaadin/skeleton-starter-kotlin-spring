name: Maven

on: [push, pull_request]

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.java }}
    - name: Set TB License
      env:
        VAADIN_PRO_KEY: ${{ secrets.VAADIN_PRO_KEY }}
      run: |
        mkdir -p ~/.vaadin/
        echo '{"username":"'`echo $VAADIN_PRO_KEY | cut -d / -f1`'","proKey":"'`echo $VAADIN_PRO_KEY | cut -d / -f2`'"}' > ~/.vaadin/proKey
    
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-v2-${{ hashFiles('**/pom.xml') }}

    - name: Clean problematic deps
      run: rm -rf ~/.m2/repository/com/vaadin
      
    - name: Build with Maven
      run: ./mvnw -B -e -V clean install -Pproduction -U
